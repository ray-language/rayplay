[package]
name = "rayplay"
version = "0.1.0"
# 1.27.19: std/audio plays inside the iOS shell (AudioQueue) and `background_audio` keeps it
# going when the app leaves the screen — the two things this app exists to exercise.
# 1.27.25: live development on the phone — `ray bundle --ios|--android --dev` builds the
# development shell (org.raylang.rayplay.dev) and `ray dev --device` reloads the program on it.
# 1.27.26: fixes the audio clicks 1.27.25 had on the iPhone (findings #112).
# 1.27.46: `std/embed` sees `[native] embed` under `ray dev --device` (findings #109), so the
# page is always served with `mount_embed_at`.
# 1.27.49: std/base64 decodes a song-sized upload in one cheap pass (findings #151, M380), and
# native `for i in 0..xs.len()` loops that write `xs[i]` no longer panic (#156).
# 1.27.50: `base64_decode_bytes` decodes the song in place in the request's octets (#161),
# so the app's own base64 decoder is gone.
raylang = "1.27.55"

# The page (www/) is plain HTML served by the process itself over ray://app; no Vite, no
# local server. `ui.mount_embed_at("", "www")` puts www/index.html at ray://app/index.html.
[native]
embed = ["www"]

[app]
name = "RayPlay"
id = "org.raylang.rayplay"
icon = "assets/icon.png"
copyright = "© 2026 Rayala"

# The sound comes from the raylang program (std/audio), never from the page, so these keep it
# playing in the background: iOS takes the `playback` audio session + UIBackgroundModes = audio,
# Android runs the program under a mediaPlayback foreground service (raylang 1.27.19, M324).
[ios]
background_audio = true

[android]
background_audio = true
