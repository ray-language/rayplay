<!doctype html>
<html lang="en" data-primary="orange">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RayPlay</title>
<link rel="stylesheet" href="/node_modules/@raylang/elements/tokens.css">
<link rel="stylesheet" href="/node_modules/@raylang/elements/base.css">
<style>
  :not(:defined) { visibility: hidden; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  .page { padding-bottom: env(safe-area-inset-bottom); }
  .now { margin-bottom: var(--ray-space-sm); }
  .title { font-size: var(--ray-font-size-lg); font-weight: var(--ray-font-weight-semibold); min-height: 1.4em; }
  .time { color: var(--ray-muted-foreground); font-variant-numeric: tabular-nums; margin: var(--ray-space-1) 0; }
  .status { margin-top: var(--ray-space-sm); color: var(--ray-muted-foreground); font-size: var(--ray-font-size-sm); white-space: pre-line; min-height: 3.6em; }
  .load { margin-top: var(--ray-space-sm); }
  .load[hidden] { display: none; }
</style>
</head>
<body>
<ray-app-shell padding="md">
  <ray-app-bar slot="header" label="RayPlay">
    <ray-theme-toggle slot="end"></ray-theme-toggle>
  </ray-app-bar>
<div class="page">
<ray-card class="now" with-border>
  <ray-stack gap="sm">
    <div>
      <div class="title" id="title">…</div>
      <div class="time"><span id="pos">0:00</span> / <span id="dur">0:00</span></div>
    </div>
    <ray-slider id="seek" min="0" max="1" value="0" disabled></ray-slider>
    <ray-group justify="space-between" nowrap>
      <ray-icon-button id="prev" label="Previous" size="lg" variant="default"><ray-icon name="skip-back"></ray-icon></ray-icon-button>
      <ray-icon-button id="toggle" label="Play" size="lg" variant="filled"><ray-icon name="play"></ray-icon></ray-icon-button>
      <ray-icon-button id="next" label="Next" size="lg" variant="default"><ray-icon name="skip-forward"></ray-icon></ray-icon-button>
      <ray-icon-button id="stop" label="Stop" size="lg" variant="default"><ray-icon name="stop"></ray-icon></ray-icon-button>
    </ray-group>
    <ray-slider id="vol" label="Volume" min="0" max="100" value="80"></ray-slider>
  </ray-stack>
</ray-card>
<ray-table id="list" label="Playlist" clickable-rows with-border density="md"></ray-table>
<!-- The program opens the native dialog and reads the file itself; the input is the fallback
     for a shell without one (there the whole file crosses the bridge as base64). -->
<ray-button class="load" id="pick" variant="default" size="md" full-width><ray-icon slot="left" name="upload"></ray-icon>Load a song</ray-button>
<ray-file-upload class="load" id="file" hidden list="none" hint="MP3, AAC, Ogg, Opus, FLAC, ALAC, WAV or AIFF" drop-label="Drop a song here" tap-label="Load a song" accept=".mp3,.flac,.m4a,.ogg,.oga,.opus,.wav,.aif,.aiff,.aifc,audio/mpeg,audio/flac,audio/wav,audio/x-wav,audio/aiff,audio/x-aiff,audio/mp4,audio/x-m4a,audio/ogg,audio/opus"></ray-file-upload>
<div class="status" id="status"></div>
</div>
</ray-app-shell>
<script type="module">
import { enableRaylang, setIcons } from "@raylang/elements";
// The transport icons the registry lacks, drawn like the built-in set (24×24, 2px currentColor stroke).
const stroke = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">';
setIcons({
  'skip-back': stroke + '<polygon points="19 20 9 12 19 4 19 20"/><line x1="5" y1="19" x2="5" y2="5"/></svg>',
  'skip-forward': stroke + '<polygon points="5 4 15 12 5 20 5 4"/><line x1="19" y1="5" x2="19" y2="19"/></svg>',
  'stop': stroke + '<rect x="5" y="5" width="14" height="14" rx="2"/></svg>',
});
// The system dialogs, menus and window for the components; null in a plain browser.
await enableRaylang();
{
  const $ = (id) => document.getElementById(id);
  let state = null;
  let volTimer = 0;
  // While the position slider is held: the track it belongs to.
  let drag = null;
  // Replies to requests sent before the last seek carry the old position: they are not painted.
  let sent = 0;
  let seekAt = 0;
  // What the playlist last showed: it is only rebuilt when that changes, not on every poll.
  let shownList = '';

  function fmt(ms) {
    const s = Math.max(0, Math.floor(ms / 1000));
    return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
  }

  async function call(op, args) {
    return request(Object.assign({ op }, args || {}));
  }

  // `body` is an object (sent as JSON) or, for a loaded file, the plain string `add:…`.
  async function request(body) {
    if (!window.ray || !window.ray.request) {
      $('status').textContent = 'no bridge: open this page inside the RayPlay app';
      return null;
    }
    const n = ++sent;
    if (body.op === 'seek') seekAt = n;
    const r = await window.ray.request(body);
    const reply = typeof r === 'string' ? JSON.parse(r) : r;
    if (!reply.ok) { $('status').textContent = 'error: ' + reply.error; return null; }
    if (n < seekAt) return reply;
    state = reply;
    render();
    return reply;
  }

  function render() {
    if (!state) return;
    const t = state.tracks[state.current];
    $('title').textContent = t ? t.name : '(no tracks)';
    $('dur').textContent = fmt(t ? t.duration_ms : 0);
    $('seek').disabled = !(t && t.duration_ms);
    if (!drag) paintPosition(state.position_ms, t ? t.duration_ms : 0);
    const sounding = state.playing && !state.paused;
    $('toggle').label = sounding ? 'Pause' : 'Play';
    $('toggle').firstElementChild.name = sounding ? 'pause' : 'play';
    if (document.activeElement !== $('vol')) $('vol').value = state.volume;
    const listKey = JSON.stringify([state.current, sounding, state.tracks]);
    if (listKey !== shownList) {
      shownList = listKey;
      $('list').data = state.tracks.map((tr, i) => ({ id: i, name: tr.name, duration_ms: tr.duration_ms }));
    }
    let s = '';
    if (state.note) s += 'last lifecycle: ' + state.note + '\n';
    if (state.background_ms > 0) s += 'played in the background: ' + fmt(state.background_ms) + '\n';
    if (state.error) s += 'error: ' + state.error;
    $('status').innerHTML = '';
    $('status').textContent = s || 'sound comes from the raylang program: switch apps and it keeps playing';
  }

  function paintPosition(ms, duration) {
    $('pos').textContent = fmt(ms);
    $('seek').max = Math.max(1, duration);
    $('seek').value = Math.min(ms, duration);
  }

  // The current track in the primary color, with ▶ while it sounds.
  function trackCell(row) {
    const span = document.createElement('span');
    const on = state && row.id === state.current;
    span.textContent = (on && state.playing && !state.paused ? '▶ ' : '') + row.name;
    if (on) span.style.color = 'var(--ray-primary)';
    return span;
  }
  $('list').columns = [
    { key: 'name', label: 'Track', render: trackCell },
    { key: 'duration_ms', label: 'Length', align: 'right', render: (row) => fmt(row.duration_ms) },
  ];
  $('list').addEventListener('ray-row-click', (e) => call('play', { index: e.detail.row.id }));
  $('toggle').onclick = () => call('toggle');
  $('stop').onclick = () => call('stop');
  $('next').onclick = () => call('next');
  $('prev').onclick = () => call('prev');
  $('vol').addEventListener('input', (e) => {
    clearTimeout(volTimer);
    volTimer = setTimeout(() => call('volume', { value: Number(e.target.value) }), 80);
  });
  // Dragging the slider only moves it (the music keeps playing where it was); letting go seeks.
  $('seek').addEventListener('input', (e) => {
    if (!state) return;
    if (!drag) drag = { track: state.current };
    $('pos').textContent = fmt(Number(e.target.value));
  });
  $('seek').addEventListener('change', (e) => {
    const d = drag;
    drag = null;
    // If the track changed under the finger, the position belongs to the old one: drop it.
    if (state && d && state.current === d.track) call('seek', { ms: Number(e.target.value) });
    else render();
  });
  function useFileInput() { $('pick').hidden = true; $('file').hidden = false; }
  if (localStorage.getItem('rayplay.noDialog')) useFileInput();
  $('pick').onclick = async () => {
    $('status').textContent = 'choose a song…';
    const r = await window.ray.request({ op: 'pick' });
    const reply = typeof r === 'string' ? JSON.parse(r) : r;
    if (reply.ok) { state = reply; render(); return; }
    // No native dialog in this shell (iOS): from now on the page's own input loads the file.
    if (reply.error.startsWith('dialog: ')) {
      useFileInput();
      localStorage.setItem('rayplay.noDialog', '1');
      $('status').textContent = 'no native file dialog here: tap again to choose the song';
      return;
    }
    $('status').textContent = 'error: ' + reply.error;
  };
  $('file').addEventListener('change', async (e) => {
    const f = e.target.files[0];
    if (!f) return;
    $('status').textContent = 'loading ' + f.name + '…';
    const buf = new Uint8Array(await f.arrayBuffer());
    let bin = '';
    for (let i = 0; i < buf.length; i += 0x8000) bin += String.fromCharCode.apply(null, buf.subarray(i, i + 0x8000));
    // A plain string, not JSON: parsing a long JSON string costs the program ~55× its size.
    await request('add:' + f.name.replace(/\.(wav|aiff?|aifc|flac|mp3|m4a|ogg|oga|opus)$/i, '').replace(/\n/g, ' ') + '\n' + btoa(bin));
    // Assigning does not fire change: the zone is ready for the next song.
    e.target.files = [];
  });

  call('state');
  // The page only paints: while it is on screen it asks for the position; in the
  // background its timers stop, the program does not.
  setInterval(() => { if (!document.hidden) call('state'); }, 500);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) call('state'); });
}
</script>
</body>
</html>
